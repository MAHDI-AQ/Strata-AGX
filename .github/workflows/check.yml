name: Checks

# The fast checks (tools/check), one job per step so a failure names its step: the CPU CMake preset, the Python suites, the host's
# typecheck / test / build.  No GPU, no model and no download of weights.  The config snapshot has its own workflow (snapshot.yml)
# and the backend compile checks theirs (backends.yml).  Run the same thing by hand:  python tools/check --only <step>

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check.yml
      - tools/check
      - requirements*.txt
      - engine/CMakeLists.txt
      - engine/CMakePresets.json
      - engine/cmake/**
      - engine/src/**
      - engine/include/**
      - engine/bench/micro/**
      - engine/third_party/**
      - tests/**
      - terminal/serve/**
      - terminal/strata.py
      - terminal/setup.py
      - terminal/strata_cli/**
      - terminal/strata_control/**
      - terminal/tools/**
      - tools/packaging/**
      - tools/docker/**
      - app/host/**
      - app/desktop/**
      - engine/metal/**
      - engine/sycl/**
  pull_request:
    paths:
      - .github/workflows/check.yml
      - tools/check
      - requirements*.txt
      - engine/CMakeLists.txt
      - engine/CMakePresets.json
      - engine/cmake/**
      - engine/src/**
      - engine/include/**
      - engine/bench/micro/**
      - engine/third_party/**
      - tests/**
      - terminal/serve/**
      - terminal/strata.py
      - terminal/setup.py
      - terminal/strata_cli/**
      - terminal/strata_control/**
      - terminal/tools/**
      - tools/packaging/**
      - tools/docker/**
      - app/host/**
      - app/desktop/**
      - engine/metal/**
      - engine/sycl/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      cmake_cpu: ${{ steps.filter.outputs.cmake_cpu }}
      py_tools: ${{ steps.filter.outputs.py_tools }}
      py_serve: ${{ steps.filter.outputs.py_serve }}
      py_tests: ${{ steps.filter.outputs.py_tests }}
      host: ${{ steps.filter.outputs.host }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          RUN_ALL=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RUN_ALL=1
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          if [ "$RUN_ALL" -eq 0 ]; then
            if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
              RUN_ALL=1
            fi
          fi
          CHANGED=""
          if [ "$RUN_ALL" -eq 0 ]; then
            CHANGED=$(git diff --name-only "$BASE" "$HEAD" || true)
            if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(\.github/workflows/check\.yml|tools/check|requirements.*\.txt|terminal/requirements.*\.txt)$'; then
              RUN_ALL=1
            fi
          fi
          has() {
            if [ "$RUN_ALL" -eq 1 ] || echo "$CHANGED" | grep -qE "$1"; then
              echo "true"
            else
              echo "false"
            fi
          }
          echo "cmake_cpu=$(has '^engine/')" >> "$GITHUB_OUTPUT"
          echo "py_tools=$(has '^(engine/|tools/|terminal/data/|terminal/tools/|docs/)')" >> "$GITHUB_OUTPUT"
          echo "py_serve=$(has '^(terminal/serve/|terminal/strata\.py|terminal/setup\.py|terminal/strata_cli/|terminal/strata_control/)')" >> "$GITHUB_OUTPUT"
          echo "py_tests=$(has '^(terminal/tests/|tests/|terminal/serve/|terminal/strata\.py|terminal/setup\.py|terminal/strata_cli/|terminal/strata_control/|tools/packaging/|tools/docker/|engine/CMakeLists\.txt|engine/metal/|engine/sycl/)')" >> "$GITHUB_OUTPUT"
          echo "host=$(has '^(app/host/|app/desktop/)')" >> "$GITHUB_OUTPUT"

  linux-cmake:
    name: Linux / cpu CMake preset
    needs: changes
    if: needs.changes.outputs.cmake_cpu == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Python packages
        run: python -m pip install -r terminal/requirements.txt -r terminal/requirements-dev.txt -r terminal/requirements-build.txt
      - name: tools/check
        run: python tools/check --only cmake-cpu --keep --scratch "$RUNNER_TEMP/check" --json "$RUNNER_TEMP/check/result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-linux-cmake
          path: |
            ${{ runner.temp }}/check/*.log
            ${{ runner.temp }}/check/result.json
          retention-days: 7

  linux-py-tools:
    name: Linux / Python terminal/tools/ (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.py_tools == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Python packages
        run: python -m pip install -r terminal/requirements.txt -r terminal/requirements-dev.txt -r terminal/requirements-build.txt
      - name: tools/check
        run: python tools/check --only py-tools --shard "${{ matrix.shard }}" --keep --scratch "$RUNNER_TEMP/check" --json "$RUNNER_TEMP/check/result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-linux-py-tools-shard-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/check/*.log
            ${{ runner.temp }}/check/result.json
          retention-days: 7

  linux-py-serve:
    name: Linux / Python terminal/serve/ (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.py_serve == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Python packages
        run: python -m pip install -r terminal/requirements.txt -r terminal/requirements-dev.txt -r terminal/requirements-build.txt
      - name: tools/check
        run: python tools/check --only py-serve --shard "${{ matrix.shard }}" --keep --scratch "$RUNNER_TEMP/check" --json "$RUNNER_TEMP/check/result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-linux-py-serve-shard-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/check/*.log
            ${{ runner.temp }}/check/result.json
          retention-days: 7

  linux-py-tests:
    name: Linux / Python tests/ (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.py_tests == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/6', '2/6', '3/6', '4/6', '5/6', '6/6']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Python packages
        run: python -m pip install -r terminal/requirements.txt -r terminal/requirements-dev.txt -r terminal/requirements-build.txt
      - name: tools/check
        run: python tools/check --only py-tests --shard "${{ matrix.shard }}" --keep --scratch "$RUNNER_TEMP/check" --json "$RUNNER_TEMP/check/result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-linux-py-tests-shard-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/check/*.log
            ${{ runner.temp }}/check/result.json
          retention-days: 7

  linux-host:
    name: Linux / host typecheck + test + build
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/host/package-lock.json
      - name: Python packages
        run: python -m pip install -r terminal/requirements.txt -r terminal/requirements-dev.txt -r terminal/requirements-build.txt
      - name: tools/check
        run: python tools/check --only host-typecheck,host-test,host-build --keep --scratch "$RUNNER_TEMP/check" --json "$RUNNER_TEMP/check/result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-linux-host
          path: |
            ${{ runner.temp }}/check/*.log
            ${{ runner.temp }}/check/result.json
          retention-days: 7

  windows:
    name: Windows / ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cpu CMake preset (MSVC), only: cmake-cpu }
          - { name: Python tests/, only: py-tests }
          - { name: Python terminal/serve/, only: py-serve }
          - { name: Python terminal/tools/, only: py-tools }
          - { name: host typecheck + test + build, only: "host-typecheck,host-test,host-build" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        if: ${{ startsWith(matrix.only, 'host') }}
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/host/package-lock.json
      - name: Python packages
        run: python -m pip install -r terminal/requirements.txt -r terminal/requirements-dev.txt -r terminal/requirements-build.txt
      # Diagnostic, not a check: what a Windows PowerShell 5.1 child returns when its parent runs under PowerShell 7 (a user who starts
      # the app or `strata` from a PowerShell 7 window). The tests drop PowerShell 7's PSModulePath entries; the product does not yet.
      - name: PowerShell 7 parent (diagnostic)
        if: ${{ startsWith(matrix.only, 'host') }}
        continue-on-error: true
        shell: pwsh
        env:
          STRATA_HOME: ${{ runner.temp }}\ps7-probe
        run: |
          "PSModulePath: $env:PSModulePath"
          "--- powershell.exe Get-CimInstance | Select-Object (as hardware.mjs)"
          powershell.exe -NoProfile -NonInteractive -Command "Get-CimInstance Win32_VideoController | Select-Object Name,PNPDeviceID | ConvertTo-Json -Compress"
          "exit $LASTEXITCODE"
          "--- the host's hardware probe (app/host/server/hardware.mjs detect)"
          node -e "import('./apps/host/server/hardware.mjs').then(m => m.detect({ force: true })).then(h => console.log(JSON.stringify({ cpu: h.cpu, gpus: h.gpus })), e => console.log('ERROR', e && e.stack))"
          "--- terminal/setup.py cpu_info (powershell Get-CimInstance Win32_Processor)"
          python -c "import sys; sys.path.insert(0, 'terminal'); import setup; print(repr(setup.cpu_info()))"
      # tools/check finds Visual Studio's compiler itself (vcvars64.bat); bash is Git for Windows' (the tester-README tests need it)
      - name: tools/check
        run: python tools/check --only "${{ matrix.only }}" --keep --scratch "$env:RUNNER_TEMP\check" --json "$env:RUNNER_TEMP\check\result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-windows-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}\check\*.log
            ${{ runner.temp }}\check\result.json
          retention-days: 7

  macos:
    # Cheap and useful (the audit found the host and Python fixtures reading the Mac's own paths), but this job has not run on a
    # Mac runner yet: it reports and does not block until its first green run.
    name: macOS / ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Python terminal/tools/, only: py-tools }
          - { name: host typecheck + test + build, only: "host-typecheck,host-test,host-build" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        if: ${{ startsWith(matrix.only, 'host') }}
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/host/package-lock.json
      - name: Python packages
        run: python -m pip install -r terminal/requirements.txt -r terminal/requirements-dev.txt
      - name: tools/check
        run: python tools/check --only "${{ matrix.only }}" --keep --scratch "$RUNNER_TEMP/check" --json "$RUNNER_TEMP/check/result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-macos-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/check/*.log
            ${{ runner.temp }}/check/result.json
          retention-days: 7
